server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API + uploaded images proxied to the backend ─────────────────
    # This keeps the browser seeing only one origin (cocktails.klktv.tech),
    # so the auth cookie can be Secure + SameSite=Lax and works in
    # iOS Safari with "Prevent Cross-Site Tracking" enabled.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
        proxy_pass_header Set-Cookie;
        client_max_body_size 8m;
    }

    location /static/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 1d;
    }

    # ── Static SPA assets ───────────────────────────────────────────
    # Long cache for hashed JS/CSS, no cache for index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
