server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No reverse proxy needed here (unlike the v1 reference frontend):
    # the v2 backend talks to the browser cross-origin directly, using
    # SameSite=none + Secure cookies (see backend/.env.example
    # COOKIE_SAMESITE/COOKIE_SECURE) — the SPA calls VITE_API_URL
    # straight from the client, no /api or /static proxy required.

    # ── Static SPA assets ───────────────────────────────────────────
    # Long cache for hashed JS/CSS, no cache for index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback — required now that routes deep-link (/classics,
    # /spirits, /kitchen, /progress); a server-side refresh on any of
    # those must still resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
