[project]
name = "klktv-cocktails-api"
version = "0.1.0"
description = "Backend API for Kollektiv cocktails menu"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "Pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
